name: ${AUTOKUMA_PROJECT_NAME:-autokuma}

services:
  autokuma:
    container_name: autokuma-${AUTOKUMA_INSTANCE:-vps}
    image: ghcr.io/bigboot/autokuma:2.1.0-rc.2
    restart: unless-stopped
    environment:
      AUTOKUMA__KUMA__URL: ${AUTOKUMA__KUMA__URL}
      AUTOKUMA__KUMA__USERNAME: ${AUTOKUMA__KUMA__USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${AUTOKUMA__KUMA__PASSWORD}
      AUTOKUMA__KUMA__CALL_TIMEOUT: ${AUTOKUMA__KUMA__CALL_TIMEOUT:-60}
      AUTOKUMA__KUMA__CONNECT_TIMEOUT: ${AUTOKUMA__KUMA__CONNECT_TIMEOUT:-60}
      AUTOKUMA__DOCKER__HOSTS: ${AUTOKUMA__DOCKER__HOSTS}
      AUTOKUMA__TAG_NAME: autokuma-${AUTOKUMA_INSTANCE:-vps}
      AUTOKUMA__DOCKER__LABEL_PREFIX: kuma
      AUTOKUMA__ON_DELETE: delete
      AUTOKUMA__DELETE_GRACE_PERIOD: ${AUTOKUMA__DELETE_GRACE_PERIOD:-86400}
      AUTOKUMA__STATIC_MONITORS: /static-monitors
      AUTOKUMA__FILES__PREPROCESS: "true"
      AUTOKUMA__ENV__NTFY_DOMAIN: ${AUTOKUMA__ENV__NTFY_DOMAIN}
      AUTOKUMA__ENV__NTFY_ACCESS_TOKEN: ${AUTOKUMA__ENV__NTFY_ACCESS_TOKEN}
      # The static resolver monitors address the DNS nodes by MagicDNS name.
      AUTOKUMA__ENV__TAILNET: ${AUTOKUMA__ENV__TAILNET}
      AUTOKUMA__ENV__PORT_SOCKY_PROXY: ${AUTOKUMA__ENV__PORT_SOCKY_PROXY}
      # Default monitor settings applied to every monitor this instance creates.
      # The static ntfy provider is reconciled from config/ntfy.json.
      AUTOKUMA__DEFAULT_SETTINGS: |-
        *.notification_name_list: ["ntfy"]
      # Site attribution. A single instance scans every Docker host, so the host a
      # container was discovered on is the only reliable source of its location.
      # system_info is the scanned host's Docker /info response, which the socket
      # proxies expose via INFO=1. Invoked per monitor as kuma.__site="<monitor id>".
      #
      # set_global rather than set, because Tera scopes set to the enclosing block.
      # Flat ifs rather than elif for the same reason. An unmapped host resolves to
      # "unknown" rather than a default site, so a gap stays visible.
      #
      # The emitted tag_names value carries no surrounding quotes. A docker-compose
      # label needs them because that file is YAML; a snippet body is not, so quotes
      # written here reach the JSON parser literally and fail it.
      #
      # A mapped host also parents the monitor under that host's group in
      # config/host-<host>.json and silences it, so ntfy hears from the group alone:
      # one alert per host incident, naming every child that is down.
      AUTOKUMA__SNIPPETS__SITE: |-
        {%- set_global host = system_info["Name"] -%}
        {%- set_global site = "unknown" -%}
        {%- if host == "docker" -%}{%- set_global site = "home" -%}{%- endif -%}
        {%- if host == "docker-seq" or host == "sequoia-rpi-4" -%}{%- set_global site = "sequoia" -%}{%- endif -%}
        {%- if host == "homelab-vps" -%}{%- set_global site = "vps" -%}{%- endif -%}
        {%- set_global type = "http" -%}
        {%- if args | length > 1 -%}{%- set_global type = args[1] -%}{%- endif %}
        {{ args[0] }}.{{ type }}.tag_names: [{"name": "site", "value": "{{ site }}"}, {"name": "host", "value": "{{ host }}"}]
        {%- if site != "unknown" %}
        {{ args[0] }}.{{ type }}.parent_name: host-{{ host }}
        {{ args[0] }}.{{ type }}.notification_name_list: []
        {%- endif %}
    volumes:
      - ${CONFIG_DIR}/autokuma/${AUTOKUMA_INSTANCE}/data:/data
      - ./config:/static-monitors:ro
    networks:
      - vps-ingress
      - monitoring-control
    labels:
      # Tag entities the site snippet references, declared once so they exist with
      # intended colours rather than being created incidentally on first use.
      - kuma.site.tag.name=site
      - "kuma.site.tag.color=#4C6EF5"
      - kuma.host.tag.name=host
      - "kuma.host.tag.color=#868E96"
      # /health answers 503 once the last full sync is older than 3x sync_interval
      # (15s), which an offline Docker host's 2x120s connect timeouts always exceed.
      # Judge the sync age instead, so only a stalled AutoKuma reads down.
      - kuma.autokuma.json-query.name=AutoKuma
      - kuma.autokuma.json-query.url=http://autokuma-vps:8090/health
      - kuma.autokuma.json-query.interval=60
      - 'kuma.autokuma.json-query.accepted_statuscodes=["200-299","503"]'
      - kuma.autokuma.json-query.json_path=last_sync_ago_seconds >= 0 and last_sync_ago_seconds < 900
      - kuma.autokuma.json-query.json_path_operator===
      - kuma.autokuma.json-query.expected_value=true
      - kuma.__site="autokuma","json-query"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  vps-ingress:
    external: true
    name: vps-ingress
  monitoring-control:
    external: true
    name: monitoring-control
