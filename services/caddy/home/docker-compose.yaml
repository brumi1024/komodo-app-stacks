name: "caddy-home"

services:
  caddy:
    container_name: caddy-home
    env_file:
      - "${KOMODO_ENV_FILE:-.env}"
    volumes:
      - ./${CADDY_INSTANCE}/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_DIR}/${CADDY_INSTANCE}/data:/data
      - ${CONFIG_DIR}/${CADDY_INSTANCE}/config:/config
    labels:
      - homepage.name=Caddy Home
      - homepage.description=Home Reverse Proxy
