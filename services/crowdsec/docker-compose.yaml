name: "crowdsec"

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Pre-install collections relevant to this homelab's edge node:
      # caddy parser + base HTTP CTI scenarios + Linux baselines.
      COLLECTIONS: "crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/linux"
      # Enrol against CrowdSec Console (free) for shared blocklists.
      # Set ENROLL_KEY via 1Password (OP__KOMODO__CROWDSEC__ENROLL_KEY) after first boot.
      ENROLL_KEY: ${CROWDSEC_ENROLL_KEY:-}
      ENROLL_INSTANCE_NAME: homelab-vps
      ENROLL_TAGS: "homelab caddy vps"
    volumes:
      # Allowlists are database state under this path, not config:
      # `cscli allowlists` manages them, and `tailnet` holds 100.64.0.0/10.
      - ${CONFIG_DIR}/crowdsec/data:/var/lib/crowdsec/data
      - ${CONFIG_DIR}/crowdsec/config:/etc/crowdsec
      # Acquisition is declared in git. The rest of /etc/crowdsec is unmanaged
      # host state, and an agent with no acquisition file parses nothing.
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      # caddy-vps access log. The caddy stack writes it under
      # ${CONFIG_DIR}/${CADDY_INSTANCE}/logs with CADDY_INSTANCE=vps, so the
      # host path is ${CONFIG_DIR}/vps/logs.
      - ${CONFIG_DIR}/vps/logs:/var/log/caddy:ro
    networks:
      - crowdsec-control
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - homepage.group=Security
      - homepage.name=CrowdSec
      - homepage.icon=crowdsec.svg
      - homepage.description=Edge intrusion detection / IP reputation

networks:
  crowdsec-control:
    external: true
    name: crowdsec-control
