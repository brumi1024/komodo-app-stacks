name: "tinyauth"

services:
  tinyauth:
    container_name: tinyauth
    image: ghcr.io/tinyauthapp/tinyauth:${TINYAUTH_TAG:-v5.1.3}
    restart: unless-stopped
    environment:
      TINYAUTH_APPURL: https://login.${DOMAIN}
      # No Docker socket is mounted, so container-label discovery is off and
      # every access rule is declared below instead.
      TINYAUTH_LABELPROVIDER: none
      # Deny by default: a host without an explicit app block below gets no
      # access, so adding a route to Caddy cannot silently grant entry.
      TINYAUTH_AUTH_ACLS_POLICY: deny
      # Required alongside the deny policy. An unset whitelist makes the email
      # check abstain, and under this policy abstain resolves to deny, which
      # refuses every OAuth login before any group is evaluated. Admit every
      # identity Pocket ID authenticates and let the per-app group ACL below
      # authorize, so membership stays managed in Pocket ID, not in this file.
      TINYAUTH_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      TINYAUTH_DATABASE_DRIVER: sqlite
      TINYAUTH_DATABASE_PATH: /data/tinyauth.db
      # Version phone-home is on by default upstream.
      TINYAUTH_ANALYTICS_ENABLED: "false"
      # Skip Tinyauth's own login page and go straight to Pocket ID.
      TINYAUTH_OAUTH_AUTOREDIRECT: pocketid
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket ID
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: ${TINYAUTH_OAUTH_CLIENT_ID:?client id required}
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: ${TINYAUTH_OAUTH_CLIENT_SECRET:?client secret required}
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://id.${DOMAIN}/authorize
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://id.${DOMAIN}/api/oidc/token
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://id.${DOMAIN}/api/oidc/userinfo
      # The provider key and the callback path segment must stay identical.
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://login.${DOMAIN}/api/oauth/callback/pocketid
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
      # Application ACLs. Each application admits any identity the provider
      # authenticates and is authorized by Pocket ID group membership.
      #
      # The per-application whitelist is upstream's counterpart of
      # TINYAUTH_OAUTH_WHITELIST. It is documented as a group list but is
      # matched against the user's email, and leaving it empty abstains, which
      # the deny policy turns into a refusal before any group is evaluated.
      TINYAUTH_APPS_DASH_CONFIG_DOMAIN: dash.${DOMAIN}
      TINYAUTH_APPS_DASH_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_DASH_OAUTH_GROUPS: homelab-users
      TINYAUTH_APPS_UPTIME_CONFIG_DOMAIN: uptime.${DOMAIN}
      TINYAUTH_APPS_UPTIME_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_UPTIME_OAUTH_GROUPS: site-admins
      # Public status pages, badges and push-monitor endpoints must stay
      # reachable without a session, or heartbeats stop arriving.
      TINYAUTH_APPS_UPTIME_PATH_ALLOW: "^/(status/.*|assets/.*|api/push/.*|api/badge/.*|api/status-page/heartbeat/.*|upload/.*|icon\\.svg)"
      TINYAUTH_APPS_PROWLARR_CONFIG_DOMAIN: prowlarr.home.${DOMAIN}
      TINYAUTH_APPS_PROWLARR_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_PROWLARR_OAUTH_GROUPS: media-admins
      TINYAUTH_APPS_SONARR_CONFIG_DOMAIN: sonarr.home.${DOMAIN}
      TINYAUTH_APPS_SONARR_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_SONARR_OAUTH_GROUPS: media-admins
      TINYAUTH_APPS_RADARR_CONFIG_DOMAIN: radarr.home.${DOMAIN}
      TINYAUTH_APPS_RADARR_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_RADARR_OAUTH_GROUPS: media-admins
      TINYAUTH_APPS_QBITTORRENT_CONFIG_DOMAIN: qbittorrent.home.${DOMAIN}
      TINYAUTH_APPS_QBITTORRENT_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_QBITTORRENT_OAUTH_GROUPS: media-admins
      TINYAUTH_APPS_EVCC_CONFIG_DOMAIN: evcc.home.${DOMAIN}
      TINYAUTH_APPS_EVCC_OAUTH_WHITELIST: "/.*/"
      TINYAUTH_APPS_EVCC_OAUTH_GROUPS: site-admins
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/tinyauth:/data
    networks:
      - vps-ingress
    healthcheck:
      test: ["CMD", "tinyauth", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # AutoKuma → central Uptime Kuma. /api/healthz returns 200 unauth.
      - kuma.tinyauth.http.name=Tinyauth
      - kuma.tinyauth.http.url=http://tinyauth:3000/api/healthz
      - kuma.tinyauth.http.interval=60

networks:
  vps-ingress:
    external: true
    name: vps-ingress
