name: "monitoring"

services:
  beszel:
    image: henrygd/beszel:0.19.0
    container_name: beszel
    restart: unless-stopped
    environment:
      - USER_CREATION=true
    volumes:
      - ${CONFIG_DIR}/beszel/beszel_data:/beszel_data
      - ${CONFIG_DIR}/beszel/beszel_socket:/beszel_socket
    networks:
      - vps-ingress
    labels:
      - homepage.group=Monitoring
      - homepage.name=Beszel
      - homepage.icon=beszel.svg
      - homepage.href=https://beszel.${DOMAIN}
      - homepage.description=Simple monitoring tool
      - kuma.beszel.http.name=Beszel
      - kuma.beszel.http.url=http://beszel:8090/api/health
      - kuma.beszel.http.interval=60
      - kuma.__site="beszel"
  beszel-agent:
    image: "henrygd/beszel-agent:0.19.0"
    container_name: "beszel-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${CONFIG_DIR}/beszel/beszel_data:/beszel_data
      - ${CONFIG_DIR}/beszel/beszel_socket:/beszel_socket
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: ${PORT_BESZEL_LISTEN}
      KEY: ${BESZEL_AGENT_KEY}
      DOCKER_HOST: ${BESZEL_DOCKER_HOST:?BESZEL_DOCKER_HOST is required}

networks:
  vps-ingress:
    external: true
    name: vps-ingress
