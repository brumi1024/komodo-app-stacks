[[stack]]
name = "monitoring-agent"
tags = ["monitoring", "beszel", "agent"]

[stack.config]
server = "docker"
poll_for_updates = true
auto_update = true
destroy_before_deploy = false
linked_repo = "app-stacks"
env_file_path = ".env.monitoring-agent"
file_paths = [
    "services/monitoring-agent/docker-compose.yaml",
]

environment = """

# Network configuration
PORT_BESZEL_LISTEN=[[OP__KOMODO__MONITORING__PORT_BESZEL_LISTEN]]
BESZEL_DOCKER_HOST=tcp://127.0.0.1:[[PORT_SOCKY_PROXY]]

# Authentication
BESZEL_AGENT_KEY=[[OP__KOMODO__MONITORING__BESZEL_AGENT_KEY]]
"""
