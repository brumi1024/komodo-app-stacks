name: "paperless"

services:
  paperless-broker:
    container_name: paperless-redis
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - paperless-redisdata:/data
    healthcheck:
      interval: 60s
      retries: 5
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      timeout: 45s

  paperless-db:
    container_name: paperless-postgres
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      # Postgres 18+ images place the cluster in a major-versioned subdirectory,
      # so the mount is the parent, not the data directory itself.
      - paperless-pgdata-18:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME}
      POSTGRES_USER: ${PAPERLESS_DB_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USER} -d ${PAPERLESS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  paperless-webserver:
    container_name: paperless-ngx
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    ports:
      - "${PORT_PAPERLESS_HTTP:-8000}:8000"
    volumes:
      - ${CONFIG_DIR}/paperless:/usr/src/paperless/data
      - type: bind
        source: ${DOCUMENTS_DIR}/paperless/data
        target: /usr/src/paperless/media
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_DIR}/paperless/export
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_DIR}/paperless/consume
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
    labels:
      - homepage.group=Personal Apps
      - homepage.name=Paperless
      - homepage.icon=paperless-ngx.svg
      - homepage.href=https://paperless.${DOMAIN}
      - homepage.description=Documents
      - homepage.widget.type=paperlessngx
      - homepage.widget.url=https://paperless.${DOMAIN}
      - homepage.widget.key=${PAPERLESS_API_AUTH_TOKEN}
      # AutoKuma → central Uptime Kuma. /api/ returns 200 unauthenticated.
      - kuma.paperless.http.name=Paperless
      - kuma.paperless.http.url=http://docker.${TAILNET}:${PORT_PAPERLESS_HTTP}/api/
      - kuma.paperless.http.interval=60
      - kuma.__site="paperless"
    environment:
      - PAPERLESS_TIME_ZONE=${TZ}
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_OCR_LANGUAGES=hun
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRETKEY}
      - PAPERLESS_DATE_ORDER=MDY

      - PAPERLESS_WEBSERVER_WORKERS=2

      # Consume dir is a local bind mount, so native watching (watchfiles)
      # works: PAPERLESS_CONSUMER_POLLING_INTERVAL defaults to 0, which means
      # no polling. See https://docs.paperless-ngx.com/configuration/.
      - PAPERLESS_CONSUMER_STABILITY_DELAY=5

      # Documents are filed into subdirectories by hand, and paperless does not
      # descend into them by default. The subdirectory name becomes a tag.
      - PAPERLESS_CONSUMER_RECURSIVE=true
      - PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS=true

      - PAPERLESS_REDIS=redis://paperless-broker:6379
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME}
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USER}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}

      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_ALLOWED_HOSTS=paperless.${DOMAIN},paperless.home.${DOMAIN}
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=${PAPERLESS_URL},https://paperless.home.${DOMAIN}
      - PAPERLESS_ENABLE_ALLAUTH=true
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - PAPERLESS_SOCIALACCOUNT_PROVIDERS=${PAPERLESS_SOCIALACCOUNT_PROVIDERS}

volumes:
  paperless-pgdata-18:
    name: paperless-pgdata-18
    driver: local
  paperless-redisdata:
    name: paperless-redisdata
    driver: local