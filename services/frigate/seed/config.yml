# Copied to /config/config.yml on first start only; after that Frigate and its UI own the live file.
# Camera Kn sits at 192.168.30.(40+n) in the IoT camera block, which has no internet access.
version: 0.18-0

mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# Caddy terminates TLS; Frigate keeps its own login on 8971.
tls:
  enabled: false

auth:
  trusted_proxies:
    - 172.16.0.0/12

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi

objects:
  track:
    - person
    - car
    - dog
    - cat

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 7
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 30

go2rtc:
  streams:
    k1_garage_nw:
      - rtsp://{FRIGATE_HIKVISION_USER}:{FRIGATE_HIKVISION_PASSWORD}@192.168.30.41:554/streaming/channels/101
    k1_garage_nw_sub:
      - rtsp://{FRIGATE_HIKVISION_USER}:{FRIGATE_HIKVISION_PASSWORD}@192.168.30.41:554/streaming/channels/102
    k3_terrace_nw:
      - rtsp://{FRIGATE_HIKVISION_USER}:{FRIGATE_HIKVISION_PASSWORD}@192.168.30.43:554/streaming/channels/101
    k3_terrace_nw_sub:
      - rtsp://{FRIGATE_HIKVISION_USER}:{FRIGATE_HIKVISION_PASSWORD}@192.168.30.43:554/streaming/channels/102

# Enable each camera in the UI once it answers on its reserved address.
cameras:
  k1_garage_nw:
    friendly_name: K1 Garázsfront ÉNy
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/k1_garage_nw
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/k1_garage_nw_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
  k3_terrace_nw:
    friendly_name: K3 Terasz ÉNy
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/k3_terrace_nw
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/k3_terrace_nw_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
