# Copied to /config/config.yml on first start only; after that Frigate and its UI own the live file.
# Cameras are added in the UI, so this public repo carries no camera inventory, addresses or coverage.
# Stream URLs can use {FRIGATE_HIKVISION_USER} and {FRIGATE_HIKVISION_PASSWORD}.
version: 0.18-0

mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# Caddy terminates TLS.
tls:
  enabled: false

# Sign-in is Pocket ID through Tinyauth: Frigate takes the user and role from the headers Caddy copies
# from Tinyauth, and accepts them only with the shared secret, so port 8971 is useless without Caddy.
auth:
  enabled: false

proxy:
  auth_secret: "{FRIGATE_PROXY_SECRET}"
  header_map:
    user: Remote-User
    role: Remote-Groups
    role_map:
      admin:
        - site-admins
  default_role: viewer

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi

objects:
  track:
    - person
    - car
    - dog
    - cat

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 7
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 30

cameras: {}
