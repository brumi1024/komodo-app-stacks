name: "frigate"

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: unless-stopped
    shm_size: 512mb
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - '${PORT_FRIGATE_HTTP:-8971}:8971'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_DIR}/frigate:/config
      - type: bind
        source: ${RECORDINGS_DIR}
        target: /media/frigate
        bind:
          create_host_path: false
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - TZ=${TZ}
      - FRIGATE_MQTT_HOST=homeassistant.${TAILNET}
      - FRIGATE_MQTT_USER=${FRIGATE_MQTT_USER}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
      - FRIGATE_PROXY_SECRET=${FRIGATE_PROXY_SECRET}
      - FRIGATE_HIKVISION_USER=${FRIGATE_HIKVISION_USER}
      - FRIGATE_HIKVISION_PASSWORD=${FRIGATE_HIKVISION_PASSWORD}
      - FRIGATE_PROTECT_FRONT_DOORBELL_HIGH=${FRIGATE_PROTECT_FRONT_DOORBELL_HIGH}
      - FRIGATE_PROTECT_FRONT_DOORBELL_LOW=${FRIGATE_PROTECT_FRONT_DOORBELL_LOW}
      - FRIGATE_PROTECT_FRONT_DOORBELL_PACKAGE=${FRIGATE_PROTECT_FRONT_DOORBELL_PACKAGE}
    labels:
      - homepage.group=Smart Home
      - homepage.name=Frigate
      - homepage.icon=frigate.svg
      - homepage.href=https://frigate.home.${DOMAIN}
      - homepage.description=Camera NVR
      - kuma.frigate.http.name=Frigate
      # Every API path needs a login on 8971; a 401 proves the backend answered nginx's auth check.
      - kuma.frigate.http.url=http://docker.${TAILNET}:${PORT_FRIGATE_HTTP}/api/version
      - 'kuma.frigate.http.accepted_statuscodes=["401"]'
      - kuma.frigate.http.interval=60
      - kuma.__site="frigate"
