[[stack]]
name = "immich"
tags = ["media", "photos"]

[stack.config]
server = "docker"
poll_for_updates = true
auto_update = true
destroy_before_deploy = false
linked_repo = "app-stacks"
env_file_path = ".env.immich"
run_directory = "services/immich"
file_paths = [
    "docker-compose.yaml"
]
# Guard against deploying onto an unmounted bind path. Photos live on a ZFS
# dataset bind-mounted into the Docker host at [[BLACKBOX_DIR]]/photos;
# without this check Docker would happily create an empty directory and
# start Immich against it. Fails after 10s.
pre_deploy = { path = "", command = "timeout 10 bash -c 'until [ -d [[BLACKBOX_DIR]]/photos ] && [ -n \"$(ls -A [[BLACKBOX_DIR]]/photos 2>/dev/null)\" ]; do sleep 1; done'" }

environment = """
KOMODO_ENV_FILE=.env.immich

# System configuration
TZ=[[TZ]]

# Version configuration

# Network and domain configuration
DOMAIN=[[OP__KOMODO__COMMON__DOMAIN]]
TAILNET=[[OP__KOMODO__COMMON__TAILNET]]
PORT_IMMICH_HTTP=[[PORT_IMMICH_HTTP]]

# Database configuration
DB_DATABASE_NAME=immich
DB_USERNAME=postgres
DB_PASSWORD=[[OP__KOMODO__IMMICH__IMMICH_DB_PASSWORD]]

# API tokens
IMMICH_API_AUTH_TOKEN=[[OP__KOMODO__IMMICH__IMMICH_API_AUTH_TOKEN]]

# Storage configuration
PHOTOS_DIR=[[BLACKBOX_DIR]]/photos
DB_DATA_LOCATION=[[CONFIG_DIR]]/immich/postgres
"""
